# WhisperDictate for Windows - configuration reference
#
# The live config lives at %APPDATA%\WhisperDictateWin\config.toml and is created
# from these defaults on first run. This file is documentation only; editing it
# changes nothing at runtime.
#
# The app rewrites the live config when you change a setting from the tray menu,
# so hand-written comments in it will not survive. Keep your notes here instead.

[hotkey]
# Which key starts dictation. Accepted: "ctrl_r", "ctrl_l", "alt_r" (right Alt /
# AltGr), "alt_l", "f1".."f20", "scroll_lock", "pause".
#
# Right Ctrl is the default, and "alt_r" is the one to avoid on a Polish layout:
# right Alt *is* AltGr, the key you hold for ą, ę, ó. The threshold and cancel
# rules below keep that from starting a recording most of the time, but "most of
# the time" is not good enough for a key you press constantly.
#
# Changeable from the tray: Hotkey > ...
key = "ctrl_r"

# "hold"   - record while held, transcribe on release (like the macOS original)
# "toggle" - press once to start, press again to stop
mode = "hold"

# Hold mode only. The key must be held this long before recording starts.
# This is what keeps AltGr usable for typing Polish characters: a quick
# AltGr+a still produces "a", only a deliberate hold starts dictation.
hold_threshold_ms = 300

# Hold mode only. If you press a normal key while the trigger is held, the
# gesture is treated as an AltGr combination and dictation is cancelled.
# Modifier keys (Ctrl/Shift/Alt) never cancel - Windows emits a synthetic
# left-Ctrl alongside AltGr, so cancelling on those would break the trigger.
cancel_on_other_key = true

[transcription]
# faster-whisper model id. Matches the macOS original's default.
# Options: "tiny", "base", "small", "medium", "large-v2", "large-v3",
#          "large-v3-turbo", "distil-large-v3.5", or a path to a local CT2 dir.
model = "large-v3-turbo"

# "pl", "en", or "auto". The original defaults to "pl" and always passes an
# explicit language, because Whisper's own default ("en") force-translates
# non-English speech instead of transcribing it.
language = "pl"

# "auto" picks CUDA when the runtime libraries load, otherwise CPU.
# Force with "cuda" or "cpu".
device = "auto"

# "auto" resolves to float16 on CUDA and int8 on CPU.
# Other values: "float32", "float16", "int8_float16", "int8".
compute_type = "auto"

beam_size = 5

# Silero VAD drops silent stretches before decoding. Strongly recommended:
# it is the single most effective guard against Whisper hallucinating
# ("Napisy stworzone przez spolecznosc Amara.org") on near-silent input.
vad_filter = true

# Optional priming text, free form. Full control over what Whisper is primed
# with; `vocabulary` below is appended to it.
initial_prompt = ""

# Proper nouns you use that Whisper mangles - comma separated. Multi-word names
# are fine; only commas separate.
#
# This one list is used twice: it primes Whisper towards these spellings, and it
# is handed to the clean-up model so a name that still came back garbled
# ("Dipsick") can be repaired. Neither half is enough alone - priming still
# misses, and repairing after the fact leaves the raw transcript in the history
# mangled and does nothing when clean-up is off.
#
# Changeable from the tray: Text clean-up > Proper nouns...
# Example: "DeepSeek, Claude Code, Anthropic, Kubernetes, Terraform"
#
# Names shared across machines belong in vocabulary.txt in the repository
# instead; the two lists are merged. Keep client and project names here, where
# they stay out of version control.
vocabulary = ""

[audio]
# Input device. null = whatever Windows considers the default input.
#
# Normally you pick this from the tray menu (Microphone), which writes the name
# here. Names, not indices: PortAudio renumbers devices whenever hardware is
# added or removed, so an index saved today points somewhere else tomorrow.
# A substring is enough ("Anker", "Yeti"). An integer index also works, but only
# until the next time you plug something in.
#
# If the named device is missing when you dictate (webcam unplugged), the app
# re-scans, then falls back to the system default and tells you it did.
device = null

# Recordings shorter than this are discarded as accidental key taps.
min_seconds = 0.4

# Hard cap on a single dictation, to bound memory use.
max_seconds = 300.0

[output]
# Put the text on the clipboard and send Ctrl+V to the focused window.
auto_paste = true

# Restore whatever was on the clipboard before the paste.
restore_clipboard = true

# Delay between setting the clipboard and sending Ctrl+V. Raise it if a slow
# app (Teams, some Electron editors) occasionally pastes stale content.
paste_delay_ms = 120

# May a dictation be kept in the Windows clipboard history (Win+V) and synced to
# the cloud clipboard? Off by default, because restore_clipboard above puts the
# previous content back but cannot remove the history entry - so every dictation
# was piling up in Win+V. The clipboard is still used either way: that is how
# Ctrl+V works. Set it to true if you want dictations in Win+V on purpose.
clipboard_history = false

[ui]
# Interface language: tray menu, recording overlay, dialogs. "pl" | "en".
#
# The first run takes it from Windows - the *display* language, not the region -
# and settles on "en" if that is neither Polish nor English. What lands here is
# always a concrete value, never "auto", so you can see what the app chose;
# a config written before this key existed gains it once, on the next start.
# Change it from the tray menu -> App language.
#
# NOT the dictation language: that is [transcription].language, and the two are
# deliberately independent - dictating in English through a Polish menu is a
# perfectly normal thing to want.
language = "pl"

# Floating always-on-top recording indicator.
overlay = true

# Short beeps on start / success / error.
sounds = true

[history]
# Append every transcription to %APPDATA%\WhisperDictateWin\history.jsonl
#
# This is also what "Copy last transcription" in the tray reads - the way back
# when Ctrl+V went into a window with no text
# field. Setting this to false hides that entry, because it would have nothing
# to hand back.
enabled = true

# The file is trimmed to this many entries (checked every 100 appends), so it
# does not grow without bound. Measured on real data: ~871 B per entry on
# average, so 5000 entries is a ceiling of about 4.2 MB. 2000 -> ~1.7 MB,
# 1000 -> ~0.83 MB.
#
# Careful below ~1000: every dictation scans the last 300 entries for proper
# nouns the clean-up model repaired, and --suggest-vocabulary reads 1000. A
# smaller history means fewer suggestions, not just a smaller file.
max_entries = 5000

# LLM clean-up of the transcript before pasting: removes fillers ("yyy", "no
# więc", "jakby", "w sensie"), applies spoken self-corrections ("wyślij do Marka
# znaczy do Marcina" -> "wyślij do Marcina"), and fixes punctuation.
#
# Off by default, matching the macOS original. It costs seconds and money, and
# raw transcription is predictable - turning this on should be deliberate.
[enhancement]
enabled = false

# "anthropic"  - Messages API. ~1 s (not measured). Needs ANTHROPIC_API_KEY.
#                Traffic: USA.
# "deepseek"   - Anthropic-compatible endpoint at api.deepseek.com. ~10x cheaper,
#                measured at ~1.5 s from Poland. Needs DEEPSEEK_API_KEY.
#                Traffic: China - do not use for work content.
# "claude_cli" - shells out to Claude Code. No key, uses your subscription;
#                measured at ~5 s with claude-sonnet-5 and the full prompt.
provider = "anthropic"

# Cleaning a transcript is not a reasoning task, so the fastest model wins.
# Model names are provider-specific; switching provider from the tray swaps this
# automatically. Offered per provider:
#   anthropic  / claude_cli : "claude-haiku-4-5", "claude-sonnet-5"
#   deepseek                : "deepseek-v4-flash", "deepseek-v4-pro"
#
# Under claude_cli pick claude-sonnet-5: haiku-4-5 through the CLI measured
# 19.8-60+ s over 5 runs (timing out twice) against sonnet's steady 4.2-5.7 s.
model = "claude-haiku-4-5"

# "default"  - full clean-up (fillers, self-corrections, punctuation)
# "chat"     - same, tuned for Slack/Teams messages
# "verbatim" - punctuation and diacritics only; keeps every spoken word
prompt = "default"

# Ceiling, not a wait. The API answers in about a second; the CLI needs far
# longer. On timeout the raw transcript is pasted instead.
timeout_seconds = 60.0

# Override the Claude Code executable if it is not on PATH.
cli_path = ""

# API keys are NOT stored here. They live in Windows Credential Manager, one
# entry per provider:
#   .\run.ps1 -SetApiKey anthropic
#   .\run.ps1 -SetApiKey deepseek
# (or the tray: Text clean-up -> API key: ...)
# ANTHROPIC_API_KEY / DEEPSEEK_API_KEY take precedence if set. Each provider
# reads only its own, so one never shadows the other.

# Literal find-and-replace applied to the transcript before pasting.
# Case-insensitive; alphanumeric keys match on word boundaries only.
[replacements]
# "kubernetes" = "Kubernetes"
# "elastik serc" = "Elasticsearch"
